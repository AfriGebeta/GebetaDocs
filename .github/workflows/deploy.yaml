name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - dev

jobs:
  create-dot-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_GEBETA_MAP_API_KEY=${{ secrets.GEBETA_MAP_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_LOCAL_TEST_URL=${{ secrets.PUBLIC_LOCAL_TEST_URL }}" >> .env
          echo "NEXT_PUBLIC_PRODUCTION_URL=${{ secrets.PUBLIC_PRODUCTION_URL }}" >> .env
          echo "GEBETA_TOKEN=${{ secrets.GEBETA_TOKEN }}" >> .env
          echo "GROQ_AI_TOKEN=${{ secrets.GROQ_AI_TOKEN }}" >> .env
      - name: Verify .env file exists
        run: ls -la
      - name: Show .env file contents
        run: cat .env
      - name: Upload .env file
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: dot-env
          path: .env

  lint-and-build:
    needs: create-dot-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Download .env file
        uses: actions/download-artifact@v4
        with:
          name: dot-env
          path: .
      - run: npm install -g pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          cp ecosystem.config.cjs deploy/
          tar -czf build.tar.gz -C deploy .
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tar.gz

  deploy:
    needs: lint-and-build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_SERVER_SSH_KEY }}
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .
      - name: Extract build
        run: mkdir build && tar -xzf build.tar.gz -C build
      - name: Show directory contents
        run: ls -la
      - name: Deploy to Azure
        env:
          AZURE_SERVER_USER: ${{ secrets.AZURE_SERVER_USER }}
          AZURE_SERVER_IP: ${{ secrets.AZURE_SERVER_IP }}
        run: |
          echo "Deploying to Azure"
          echo "Downloaded artifact..."
          ls -la
          echo "Current working directory:"
          pwd
          # Create a directory for the new version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NEW_VERSION="${GITHUB_REF_NAME#v}"
          else
            NEW_VERSION="main-${GITHUB_SHA::7}"
          fi
          ssh -o StrictHostKeyChecking=no $AZURE_SERVER_USER@$AZURE_SERVER_IP "mkdir -p ~/gebeta-docs/releases/$NEW_VERSION"

          # Copy files to the new version directory
          rsync -avz --progress --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            build/ $AZURE_SERVER_USER@$AZURE_SERVER_IP:~/gebeta-docs/releases/$NEW_VERSION/

          # Update the symlink to point to the new version
          ssh -o StrictHostKeyChecking=no $AZURE_SERVER_USER@$AZURE_SERVER_IP "ln -sfn ~/gebeta-docs/releases/$NEW_VERSION ~/gebeta-docs/current"

          ssh -o StrictHostKeyChecking=no $AZURE_SERVER_USER@$AZURE_SERVER_IP \
            "node -v; pm2 delete gebeta-docs || true; pm2 start ~/gebeta-docs/current/ecosystem.config.cjs && pm2 save"