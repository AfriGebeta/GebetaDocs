name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev

jobs:
  create-dot-env:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Create .env file
      run: |
        echo "No envs to create"

  lint-and-build:
    needs: create-dot-env
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    - run: npm install -g pnpm@latest-10
    - run: pnpm install --frozen-lockfile
    - run: pnpm build
    - name: Prepare Deployment Artifacts
      run: |
        mkdir -p deploy
        cp -r .next public package.json pnpm-lock.yaml deploy/
    - uses: actions/upload-artifact@v4
      with:
        name: build
        path: |
          .next
          public
          package.json
          pnpm-lock.yaml
        retention-days: 7
        include-hidden-files: true  

  deploy:
    needs: lint-and-build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.AZURE_SERVER_SSH_KEY }}
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build
        path: build
        include-hidden-files: true
    - name: Show directory contents
      run: ls -la
    - name: Deploy to Azure
      env:
        AZURE_SERVER_USER: ${{ secrets.AZURE_SERVER_USER }}
        AZURE_SERVER_IP: ${{ secrets.AZURE_SERVER_IP }}
      run: |
        echo "Deploying to Azure"
        echo "Downloaded artifact..."
        ls -la
        echo "Current working directory:"
        pwd
        # Create a directory for the new version
        NEW_VERSION=$(echo ${{ github.ref }} | sed 's/refs\/tags\/v//')
        ssh -o StrictHostKeyChecking=no $AZURE_SERVER_USER@$AZURE_SERVER_IP "mkdir -p ~/gebeta-docs/releases/$NEW_VERSION"

        # Copy files to the new version directory
        scp -o StrictHostKeyChecking=no -r build/* $AZURE_SERVER_USER@$AZURE_SERVER_IP:~/gebeta-docs/releases/$NEW_VERSION
        
        # Update the symlink to point to the new version
        ssh -o StrictHostKeyChecking=no $AZURE_SERVER_USER@$AZURE_SERVER_IP "ln -sfn ~/gebeta-docs/releases/$NEW_VERSION ~/gebeta-docs/current"

